<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LeveLeledc Scanner</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: #0d1117;
            color: #e6edf3;
            min-height: 100vh;
            line-height: 1.5;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        header {
            text-align: center;
            margin-bottom: 2rem;
            padding-bottom: 1.5rem;
            border-bottom: 1px solid #30363d;
        }

        h1 {
            font-size: 2rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, #58a6ff, #a371f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            color: #8b949e;
            font-size: 0.95rem;
        }

        .controls {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            justify-content: center;
            margin-bottom: 2rem;
            padding: 1.5rem;
            background: #161b22;
            border-radius: 12px;
            border: 1px solid #30363d;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .control-group label {
            font-size: 0.85rem;
            color: #8b949e;
            font-weight: 500;
        }

        select, input {
            padding: 0.6rem 1rem;
            font-size: 0.95rem;
            border: 1px solid #30363d;
            border-radius: 8px;
            background: #0d1117;
            color: #e6edf3;
            min-width: 150px;
            cursor: pointer;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        select:hover, input:hover {
            border-color: #58a6ff;
        }

        select:focus, input:focus {
            outline: none;
            border-color: #58a6ff;
            box-shadow: 0 0 0 3px rgba(88, 166, 255, 0.15);
        }

        .btn {
            padding: 0.7rem 1.5rem;
            font-size: 0.95rem;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn-primary {
            background: linear-gradient(135deg, #238636, #2ea043);
            color: white;
            align-self: flex-end;
        }

        .btn-primary:hover {
            background: linear-gradient(135deg, #2ea043, #3fb950);
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(46, 160, 67, 0.3);
        }

        .btn-primary:disabled {
            background: #21262d;
            color: #484f58;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .timeframe-toggles {
            display: flex;
            gap: 0.5rem;
        }

        .timeframe-btn {
            padding: 0.6rem 1.2rem;
            font-size: 0.95rem;
            font-weight: 600;
            border: 1px solid #30363d;
            border-radius: 8px;
            background: #0d1117;
            color: #8b949e;
            cursor: pointer;
            transition: all 0.2s;
            opacity: 0.5;
        }

        .timeframe-btn:hover {
            border-color: #58a6ff;
            opacity: 0.75;
        }

        .timeframe-btn.active {
            background: #238636;
            border-color: #238636;
            color: white;
            opacity: 1;
        }

        .timeframe-btn.active:hover {
            background: #2ea043;
            border-color: #2ea043;
        }

        .spinner {
            width: 16px;
            height: 16px;
            border: 2px solid transparent;
            border-top-color: currentColor;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .status {
            text-align: center;
            padding: 3rem;
            color: #8b949e;
        }

        .status-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
        }

        .results-grid {
            display: grid;
            gap: 1.5rem;
        }

        .result-section {
            background: #161b22;
            border-radius: 12px;
            border: 1px solid #30363d;
            overflow: hidden;
        }

        .section-header {
            padding: 1rem 1.25rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            border-bottom: 1px solid #30363d;
        }

        .section-header .badge {
            background: #30363d;
            padding: 0.2rem 0.6rem;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 500;
        }

        .bullish-now .section-header {
            background: linear-gradient(135deg, rgba(46, 160, 67, 0.15), rgba(46, 160, 67, 0.05));
            border-left: 3px solid #3fb950;
        }

        .bearish-now .section-header {
            background: linear-gradient(135deg, rgba(248, 81, 73, 0.15), rgba(248, 81, 73, 0.05));
            border-left: 3px solid #f85149;
        }

        .bullish-recent .section-header {
            background: linear-gradient(135deg, rgba(210, 153, 34, 0.15), rgba(210, 153, 34, 0.05));
            border-left: 3px solid #d29922;
        }

        .bearish-recent .section-header {
            background: linear-gradient(135deg, rgba(219, 109, 40, 0.15), rgba(219, 109, 40, 0.05));
            border-left: 3px solid #db6d28;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 0.85rem 1.25rem;
            text-align: left;
        }

        th {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #8b949e;
            font-weight: 600;
            background: #0d1117;
        }

        tr:not(:last-child) td {
            border-bottom: 1px solid #21262d;
        }

        tr:hover td {
            background: rgba(88, 166, 255, 0.05);
        }

        .symbol {
            font-weight: 600;
            color: #58a6ff;
        }

        .price {
            font-family: 'SF Mono', Monaco, 'Courier New', monospace;
            color: #e6edf3;
        }

        .bars-ago {
            color: #8b949e;
            font-size: 0.9rem;
        }

        .scan-info {
            display: flex;
            justify-content: center;
            gap: 2rem;
            margin-bottom: 1.5rem;
            padding: 1rem;
            background: #161b22;
            border-radius: 8px;
            border: 1px solid #30363d;
        }

        .scan-stat {
            text-align: center;
        }

        .scan-stat-value {
            font-size: 1.5rem;
            font-weight: 600;
            color: #58a6ff;
        }

        .scan-stat-label {
            font-size: 0.8rem;
            color: #8b949e;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .empty-state {
            padding: 2rem;
            text-align: center;
            color: #8b949e;
        }

        .progress-container {
            background: #161b22;
            border-radius: 12px;
            border: 1px solid #30363d;
            padding: 2rem;
            text-align: center;
        }

        .progress-header {
            margin-bottom: 1.5rem;
        }

        .progress-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        .progress-subtitle {
            color: #8b949e;
            font-size: 0.9rem;
        }

        .progress-bar-wrapper {
            background: #0d1117;
            border-radius: 8px;
            height: 12px;
            overflow: hidden;
            margin-bottom: 1rem;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #238636, #3fb950);
            border-radius: 8px;
            transition: width 0.3s ease;
            width: 0%;
        }

        .progress-stats {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        .progress-count {
            font-size: 1.5rem;
            font-weight: 600;
            color: #58a6ff;
        }

        .progress-percent {
            font-size: 1.1rem;
            color: #8b949e;
        }

        .progress-current {
            color: #8b949e;
            font-size: 0.85rem;
            font-family: 'SF Mono', Monaco, 'Courier New', monospace;
        }

        @media (max-width: 768px) {
            .container {
                padding: 1rem;
            }

            .controls {
                flex-direction: column;
            }

            .control-group {
                width: 100%;
            }

            select, input {
                width: 100%;
            }

            .btn {
                width: 100%;
                justify-content: center;
            }

            .scan-info {
                flex-wrap: wrap;
                gap: 1rem;
            }

            th, td {
                padding: 0.6rem 0.8rem;
                font-size: 0.9rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>LeveLeledc Scanner</h1>
            <p class="subtitle">Scan crypto markets for exhaustion signals</p>
        </header>

        <div class="controls">
            <div class="control-group">
                <label for="exchange">Exchange</label>
                <select id="exchange">
                    {% for ex in exchanges %}
                    <option value="{{ ex }}">{{ ex|capitalize }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="control-group">
                <label>Timeframes</label>
                <div class="timeframe-toggles">
                    <button type="button" class="timeframe-btn active" data-timeframe="1w" onclick="toggleTimeframe(this)">1W</button>
                    <button type="button" class="timeframe-btn active" data-timeframe="2w" onclick="toggleTimeframe(this)">2W</button>
                </div>
            </div>

            <div class="control-group">
                <label for="min-volume">Min Volume (USD)</label>
                <input type="number" id="min-volume" value="1000000" step="100000">
            </div>

            <button class="btn btn-primary" id="scan-btn" onclick="runScan()">
                <span id="btn-text">Scan</span>
            </button>
        </div>

        <div id="results">
            <div class="status">
                <div class="status-icon">📊</div>
                <p>Select an exchange and click Scan to find exhaustion signals</p>
            </div>
        </div>
    </div>

    <script>
        function toggleTimeframe(btn) {
            btn.classList.toggle('active');
        }

        function getSelectedTimeframes() {
            const buttons = document.querySelectorAll('.timeframe-btn.active');
            return Array.from(buttons).map(btn => btn.dataset.timeframe);
        }

        function runScan() {
            const btn = document.getElementById('scan-btn');
            const btnText = document.getElementById('btn-text');
            const resultsDiv = document.getElementById('results');

            const exchange = document.getElementById('exchange').value;
            const timeframes = getSelectedTimeframes();
            const minVolume = document.getElementById('min-volume').value;

            if (timeframes.length === 0) {
                resultsDiv.innerHTML = `
                    <div class="status">
                        <div class="status-icon">⚠️</div>
                        <p>Please select at least one timeframe</p>
                    </div>
                `;
                return;
            }

            // Show initial loading state
            btn.disabled = true;
            btnText.innerHTML = '<span class="spinner"></span> Scanning...';
            resultsDiv.innerHTML = `
                <div class="progress-container">
                    <div class="progress-header">
                        <div class="progress-title">Initializing scan...</div>
                        <div class="progress-subtitle">${exchange.toUpperCase()} - ${timeframes.join(', ').toUpperCase()}</div>
                    </div>
                    <div class="progress-bar-wrapper">
                        <div class="progress-bar" id="progress-bar"></div>
                    </div>
                    <div class="progress-stats">
                        <span class="progress-count" id="progress-count">0 / 0</span>
                        <span class="progress-percent" id="progress-percent">0%</span>
                    </div>
                    <div class="progress-current" id="progress-current">Starting...</div>
                </div>
            `;

            // Use Server-Sent Events for real-time progress
            const url = `/api/scan?exchange=${exchange}&timeframes=${timeframes.join(',')}&min_volume=${minVolume}`;
            const eventSource = new EventSource(url);
            let allResults = [];

            eventSource.onmessage = function(event) {
                const data = JSON.parse(event.data);

                if (data.type === 'status') {
                    document.getElementById('progress-current').textContent = data.message;
                }
                else if (data.type === 'init') {
                    document.querySelector('.progress-title').textContent = `Scanning ${data.total} pairs (${data.timeframe})...`;
                    document.getElementById('progress-count').textContent = `0 / ${data.total}`;
                }
                else if (data.type === 'progress') {
                    const percent = Math.round((data.completed / data.total) * 100);
                    document.getElementById('progress-bar').style.width = `${percent}%`;
                    document.getElementById('progress-count').textContent = `${data.completed} / ${data.total}`;
                    document.getElementById('progress-percent').textContent = `${percent}%`;
                    document.getElementById('progress-current').textContent = `Scanning ${data.symbol} (${data.timeframe})`;
                }
                else if (data.type === 'timeframe_complete') {
                    allResults.push(data.results);
                }
                else if (data.type === 'complete') {
                    eventSource.close();
                    displayResults(allResults);
                    btn.disabled = false;
                    btnText.textContent = 'Scan';
                }
                else if (data.type === 'error') {
                    eventSource.close();
                    resultsDiv.innerHTML = `
                        <div class="status">
                            <div class="status-icon">⚠️</div>
                            <p>Error: ${data.message}</p>
                        </div>
                    `;
                    btn.disabled = false;
                    btnText.textContent = 'Scan';
                }
            };

            eventSource.onerror = function() {
                eventSource.close();
                resultsDiv.innerHTML = `
                    <div class="status">
                        <div class="status-icon">❌</div>
                        <p>Connection lost. Please try again.</p>
                    </div>
                `;
                btn.disabled = false;
                btnText.textContent = 'Scan';
            };
        }

        function displayResults(resultsArray) {
            const resultsDiv = document.getElementById('results');

            // Combine results from all timeframes
            const combined = {
                bullish_now: [],
                bearish_now: [],
                bullish_recent: [],
                bearish_recent: []
            };

            let exchange = '';
            let totalPairs = 0;

            for (const data of resultsArray) {
                exchange = data.exchange;
                totalPairs += data.filtered_pairs;
                combined.bullish_now.push(...data.bullish_now);
                combined.bearish_now.push(...data.bearish_now);
                combined.bullish_recent.push(...data.bullish_recent);
                combined.bearish_recent.push(...data.bearish_recent);
            }

            const totalSignals = combined.bullish_now.length + combined.bearish_now.length +
                                combined.bullish_recent.length + combined.bearish_recent.length;

            const timeframes = resultsArray.map(r => r.timeframe.toUpperCase()).join(', ');

            let html = `
                <div class="scan-info">
                    <div class="scan-stat">
                        <div class="scan-stat-value">${exchange.toUpperCase()}</div>
                        <div class="scan-stat-label">Exchange</div>
                    </div>
                    <div class="scan-stat">
                        <div class="scan-stat-value">${timeframes}</div>
                        <div class="scan-stat-label">Timeframes</div>
                    </div>
                    <div class="scan-stat">
                        <div class="scan-stat-value">${totalSignals}</div>
                        <div class="scan-stat-label">Signals Found</div>
                    </div>
                </div>
                <div class="results-grid">
            `;

            // Bullish Now
            if (combined.bullish_now.length > 0) {
                html += createSection('bullish-now', '🟢 Bullish Exhaustion - Current Bar', combined.bullish_now);
            }

            // Bearish Now
            if (combined.bearish_now.length > 0) {
                html += createSection('bearish-now', '🔴 Bearish Exhaustion - Current Bar', combined.bearish_now);
            }

            // Bullish Recent
            if (combined.bullish_recent.length > 0) {
                html += createSection('bullish-recent', '🟡 Bullish Exhaustion - Recent', combined.bullish_recent, 'bars_since_bullish');
            }

            // Bearish Recent
            if (combined.bearish_recent.length > 0) {
                html += createSection('bearish-recent', '🟠 Bearish Exhaustion - Recent', combined.bearish_recent, 'bars_since_bearish');
            }

            html += '</div>';

            if (totalSignals === 0) {
                html += `
                    <div class="status">
                        <div class="status-icon">✨</div>
                        <p>No exhaustion signals found</p>
                    </div>
                `;
            }

            resultsDiv.innerHTML = html;
        }

        function createSection(className, title, items, barsField = null) {
            const count = items.length;
            let html = `
                <div class="result-section ${className}">
                    <div class="section-header">
                        <span>${title}</span>
                        <span class="badge">${count}</span>
                    </div>
                    <table>
                        <thead>
                            <tr>
                                <th>Symbol</th>
                                <th>Timeframe</th>
                                <th>Price</th>
                                ${barsField ? '<th>Bars Ago</th>' : ''}
                            </tr>
                        </thead>
                        <tbody>
            `;

            // Sort by symbol then timeframe
            items.sort((a, b) => {
                const symA = a.display_symbol || a.symbol;
                const symB = b.display_symbol || b.symbol;
                if (symA !== symB) return symA.localeCompare(symB);
                return a.timeframe.localeCompare(b.timeframe);
            });

            for (const item of items) {
                const symbol = item.display_symbol || item.symbol;
                const price = formatPrice(item.current_price);
                const tf = item.timeframe.toUpperCase();
                const barsAgo = barsField ? item[barsField] : null;

                html += `
                    <tr>
                        <td class="symbol">${symbol}</td>
                        <td>${tf}</td>
                        <td class="price">$${price}</td>
                        ${barsField ? `<td class="bars-ago">${barsAgo !== null ? barsAgo : '-'}</td>` : ''}
                    </tr>
                `;
            }

            html += '</tbody></table></div>';
            return html;
        }

        function formatPrice(price) {
            if (price >= 1) {
                return price.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
            } else if (price >= 0.0001) {
                return price.toFixed(6);
            } else {
                return price.toExponential(4);
            }
        }
    </script>
</body>
</html>
